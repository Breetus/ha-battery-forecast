# Energy Planner dashboard (YAML mode). See README for how it's registered.
title: Energy Planner
views:
  - title: Energy Planner
    path: energy-planner
    icon: mdi:robot
    cards:
      # Copied from the home dashboard's Battery tab (the battery chart's green and
      # dashed lines now show the planner instead of PowerSync).
      - type: custom:power-flow-card-plus
        entities:
          battery:
            entity:
              consumption: sensor.ps_battery_discharging_power
              production: sensor.ps_battery_charging_power
            state_of_charge: sensor.power_sync_battery_level
          grid:
            entity:
              consumption: sensor.ps_grid_import_power
              production: sensor.ps_grid_export_power
          solar:
            entity: sensor.power_sync_solar_power
          home:
            secondary_info: {}
            icon: ""
            entity: sensor.power_sync_home_load
            subtract_individual: true
          fossil_fuel_percentage:
            secondary_info: {}
          individual:
            - entity: sensor.ev_charging_power
              name: Mini
              icon: mdi:car-electric
              display_zero_tolerance: 0
              display_zero: true
              secondary_info:
                entity: sensor.wmw52ga0507r62550_battery_hv_state_of_charge
                unit_of_measurement: "%"
                decimals: 0
                display_zero: true
        clickable_entities: true
        display_zero_lines:
          mode: transparency
          transparency: 90
          grey_color: [189, 189, 189]
        use_new_flow_rate_model: true
        min_flow_rate: 0.75
        max_flow_rate: 6
        max_expected_power: 2000
        min_expected_power: 0.01
        transparency_zero_lines: 0
        kilo_threshold: 1000
        base_decimals: 0
        kilo_decimals: 1
      - type: custom:apexcharts-card
        graph_span: "10h"
        span:
          offset: "+5h"
        header:
          show: true
          title: Price
          show_states: true  # the live buy price and FiT
          colorize_states: true
        now:
          show: true
          label: Now
        apex_config:
          legend:
            show: true
          tooltip:
            y:
              enabled: true
              formatter: function (val) { return val.toFixed(2); }
        yaxis:
          - id: first
            decimals: 2
            opposite: false
        series:
          - entity: sensor.jimboombasolar_general_forecast
            yaxis_id: first
            type: line
            color: red
            stroke_width: 2
            name: Buy Price Forecast
            unit: $/kWh
            data_generator: |
              const forecasts = entity.attributes.forecasts;
              const result = forecasts.map(e => [
                new Date(e.start_time).getTime(),
                parseFloat(e.per_kwh || 0)
              ]);
              return result;
            show:
              legend_value: false
              in_header: false
          - entity: sensor.jimboombasolar_feed_in_forecast
            yaxis_id: first
            type: line
            stroke_width: 2
            name: FIT Forecast
            unit: $/kWh
            data_generator: |
              const forecasts = entity.attributes.forecasts;
              const result = forecasts.map(e => [
                new Date(e.start_time).getTime(),
                parseFloat(e.per_kwh || 0)
              ]);
              return result;
            show:
              legend_value: false
              in_header: false
          - entity: sensor.jimboombasolar_general_price
            type: line
            color: orange
            stroke_width: 2
            name: Buy now
            unit: $/kWh
            extend_to: false
            yaxis_id: first
            float_precision: 3
            show:
              legend_value: false
          - entity: sensor.jimboombasolar_feed_in_price
            type: line
            stroke_width: 2
            name: FiT now
            unit: $/kWh
            extend_to: false
            yaxis_id: first
            float_precision: 3
            show:
              legend_value: false
      - type: custom:apexcharts-card
        header:
          show: true
          show_states: true
          colorize_states: false
        graph_span: "38h"
        span:
          offset: "+12h"
        now:
          show: true
          color: "#898781"
        yaxis:
          - min: 0
            max: 100
            decimals: 0
        apex_config:
          legend:
            show: false
          grid:
            strokeDashArray: 0
          tooltip:
            x:
              format: HH:mm
        series:
          - entity: sensor.power_sync_battery_level
            name: Actual SOC
            color: "#2a78d6"
            stroke_width: 2
            extend_to: false
            group_by:
              func: avg
              duration: "5min"
            show:
              name_in_header: false
          # Green: the planner's own force charges (was PowerSync's optimiser).
          - entity: sensor.energy_planner_battery_while_planner_charges
            name: Force charge (planner)
            color: "#43a047"
            stroke_width: 6
            extend_to: false
            group_by:
              func: avg
              duration: "1min"
            show:
              in_header: false
              name_in_header: false
          - entity: sensor.battery_soc_force_charge_external
            name: Force charge (external)
            color: "#ff9800"
            stroke_width: 6
            extend_to: false
            group_by:
              func: avg
              duration: "1min"
            show:
              in_header: false
              name_in_header: false
          # Dashed: the planner's expected battery SoC.
          - entity: sensor.energy_planner_plan_now
            name: Plan
            color: "#2a78d6"
            stroke_width: 2
            stroke_dash: 5
            extend_to: false
            show:
              in_header: false
              name_in_header: false
            data_generator: |
              return (entity.attributes.steps || []).map(s => [new Date(s.start).getTime(), s.battery_soc_pct]);
      - type: entities
        title: Control
        entities:
          - entity: select.energy_planner_mode
          - entity: sensor.energy_planner_status
          - entity: binary_sensor.energy_planner_plan_blocked
          - type: attribute
            entity: sensor.energy_planner_status
            attribute: ev
            name: EV
          - entity: sensor.energy_planner_plan_now
          - entity: sensor.energy_planner_next_change
          - entity: sensor.power_sync_battery_mode
            name: PowerSync battery mode
      - type: entities
        title: Targets for the evening peak
        entities:
          - entity: time.energy_planner_peak_price_starts
          - entity: number.energy_planner_battery_target_at_peak
          - entity: sensor.energy_planner_battery_at_peak
            name: Battery expected at peak
          - entity: number.energy_planner_ev_target_at_peak
          - entity: sensor.wmw52ga0507r62550_battery_hv_state_of_charge
            name: Car state of charge now
          - entity: sensor.wmw52ga0507r62550_battery_ev_target_state_of_charge
            name: Charge limit set in the car
          - entity: sensor.energy_planner_ev_at_peak
            name: EV expected at peak
          - entity: sensor.energy_planner_plan_cost
      - type: entities
        title: Preferences
        entities:
          - entity: select.energy_planner_solar_forecast
          - entity: switch.energy_planner_allow_selling_to_grid
          - entity: switch.energy_planner_allow_grid_charging
          - entity: switch.energy_planner_control_ev_charger
          - entity: number.energy_planner_battery_reserve
          - entity: number.energy_planner_battery_wear_cost
          - entity: number.energy_planner_grid_import_limit
          - entity: number.energy_planner_ev_battery_size
          - entity: number.energy_planner_ev_state_of_charge_manual
            name: Car SoC if its sensor is unavailable
      - type: custom:apexcharts-card
        header:
          show: true
          title: Plan
        graph_span: 36h
        span:
          start: minute
        yaxis:
          - id: kw
            decimals: 1
            apex_config:
              title: { text: kW }
          - id: pct
            opposite: true
            min: 0
            max: 100
            decimals: 0
            apex_config:
              title: { text: "%" }
          - id: price
            opposite: true
            decimals: 2
            apex_config:
              title: { text: $/kWh }
        series:
          - entity: sensor.energy_planner_plan_now
            name: Battery %
            yaxis_id: pct
            type: line
            stroke_width: 3
            data_generator: |
              return (entity.attributes.steps || []).map(s => [new Date(s.start).getTime(), s.battery_soc_pct]);
          - entity: sensor.energy_planner_plan_now
            name: EV %
            yaxis_id: pct
            type: line
            stroke_width: 2
            data_generator: |
              return (entity.attributes.steps || []).filter(s => s.ev_soc_pct !== null).map(s => [new Date(s.start).getTime(), s.ev_soc_pct]);
          - entity: sensor.energy_planner_plan_now
            name: Battery kW (+charge)
            yaxis_id: kw
            type: column
            data_generator: |
              return (entity.attributes.steps || []).map(s => [new Date(s.start).getTime(), s.battery_kw]);
          - entity: sensor.energy_planner_plan_now
            name: Car kW
            yaxis_id: kw
            type: column
            data_generator: |
              return (entity.attributes.steps || []).map(s => [new Date(s.start).getTime(), s.ev_kw]);
          - entity: sensor.energy_planner_plan_now
            name: Grid kW (+import)
            yaxis_id: kw
            type: line
            curve: stepline
            data_generator: |
              return (entity.attributes.steps || []).map(s => [new Date(s.start).getTime(), s.grid_kw]);
          - entity: sensor.energy_planner_plan_now
            name: Import price
            yaxis_id: price
            type: line
            curve: stepline
            stroke_width: 1
            data_generator: |
              return (entity.attributes.steps || []).map(s => [new Date(s.start).getTime(), s.import_price]);
          - entity: sensor.energy_planner_plan_now
            name: Feed-in price
            yaxis_id: price
            type: line
            curve: stepline
            stroke_width: 1
            data_generator: |
              return (entity.attributes.steps || []).map(s => [new Date(s.start).getTime(), s.export_price]);
      - type: markdown
        title: Next 12 hours
        content: |
          | Time | Plan | Batt % | Car % | Grid kW | Buy | Sell |
          |---|---|---|---|---|---|---|
          {%- for s in (state_attr('sensor.energy_planner_plan_now', 'steps') or [])[:24] %}
          | {{ as_timestamp(s.start) | timestamp_custom('%H:%M') }} | {{ s.mode }}{% if s.power_kw %} {{ s.power_kw }} kW{% endif %}{% if s.ev_kw > 0.05 %} + car {{ s.ev_kw | round(1) }} kW{% if s.ev_solar %} solar{% endif %}{% endif %}{% if s.curtail %}, solar off{% endif %} | {{ s.battery_soc_pct }} | {{ s.ev_soc_pct if s.ev_soc_pct is not none else '' }} | {{ s.grid_kw | round(1) }} | {{ (s.import_price * 100) | round(0) }}c | {{ (s.export_price * 100) | round(0) }}c |
          {%- endfor %}
